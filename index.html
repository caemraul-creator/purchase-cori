<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Request System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">

  <!-- html2pdf untuk export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="theme-dashboard">

  <!-- USER FLOATER -->
  <div id="userFloater" class="user-floater"></div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- GLOBAL LOADING -->
  <div id="globalLoading"></div>

  <!-- APP CONTAINER -->
  <div id="app">
    <!-- Semua page container akan di-render oleh JavaScript -->
  </div>

  <!-- SCRIPTS -->
  <script src="config.js"></script>
  <script src="ui-helper.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>

  <!-- CEK LOGIN DENGAN AMAN -->
  <script>
    (function () {
      var isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      console.log('🔐 Index page - isLoggedIn:', isLoggedIn);

      if (!isLoggedIn) {
        console.log('❌ Not logged in, redirecting to login.html');
        window.location.href = 'login.html';
      } else {
        console.log('✅ User already logged in');
      }
    })();
  </script>
</body>

</html>
